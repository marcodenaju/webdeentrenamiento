<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomía Muscular — Entrenamiento de Fuerza</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#111112;--bg2:#19191b;--bg3:#202023;
    --border:#313134;--border-soft:#262628;
    --text:#f0eee6;--text2:#8d8d92;--text3:#5c5c60;
    --accent:#e3b23c;--accent-ink:#1a1408;--green:#4a9e6b
  }
  html,body{background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;min-height:100vh;-webkit-font-smoothing:antialiased}
  body{
    background-image:
      linear-gradient(var(--border-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
    background-size:28px 28px;background-attachment:fixed;
  }
  header{padding:20px 28px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:baseline;gap:14px}
  header h1{font-family:'Bebas Neue',sans-serif;font-size:26px;font-weight:400;letter-spacing:.02em}
  header h1 em{font-style:normal;color:var(--accent)}
  .badge{margin-left:auto;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);border:1px solid var(--border);padding:4px 10px}
  .hint{background:var(--bg3);border-bottom:1px solid var(--border);padding:8px 28px;font-size:11px;color:var(--text2)}
  .atlas{display:flex;justify-content:center;gap:40px;padding:20px 16px 0;flex-wrap:wrap}
  .figure-col{display:flex;flex-direction:column;align-items:center;flex:1;max-width:700px;min-width:320px}
  .fig-title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  /* Single SVG contains image + lines + foreignObject labels */
  svg.fig{width:100%;height:auto;display:block;overflow:visible}
  /* Label styles inside SVG foreignObject */
  .lbl{
    display:inline-block;
    font-size:10.5px;
    color:var(--text2);
    padding:1px 5px;
    cursor:pointer;
    white-space:nowrap;
    transition:color .12s,background .12s;
    font-family:'IBM Plex Mono',monospace;
    line-height:1.4;
  }
  .lbl:hover,.lbl.active{color:var(--accent-ink);background:var(--accent)}
  .info-panel{
    border-top:1px solid var(--border);background:var(--bg2);
    padding:16px 24px;min-height:90px;
    display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;
    margin-top:20px;
  }
  .info-placeholder{color:var(--text3);font-style:normal;font-size:12px;margin:auto}
  .info-name{font-family:'Bebas Neue',sans-serif;font-size:24px;font-weight:400;color:var(--accent);min-width:180px;border-right:1px solid var(--border);padding-right:18px;align-self:stretch;display:flex;flex-direction:column;justify-content:center;line-height:1.15}
  .info-name small{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
  .info-body{flex:1;display:flex;gap:18px;flex-wrap:wrap}
  .info-func{flex:1;min-width:140px}
  .info-func p{font-size:12px;color:var(--text2);line-height:1.6;margin-top:3px}
  .sec-label{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
  .ex-grid{flex:2;min-width:200px}
  .ex-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .ex-chip{font-size:10px;padding:2px 8px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);line-height:1.5;transition:background .12s,color .12s,border-color .12s}
  .ex-chip:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);cursor:default}
</style>
</head>
<body>
<header>
  <h1>ANATOMÍA MUSCULAR <em>·</em> ENTRENAMIENTO DE FUERZA</h1>
  <span class="badge">Atlas interactivo</span>
</header>
<div class="hint">Pasá el mouse sobre el nombre de un músculo para ver su función y ejercicios</div>

<div class="atlas">
  <div class="figure-col">
    <div class="fig-title">Vista posterior</div>
    <svg class="fig" id="svg-post" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="figure-col">
    <div class="fig-title">Vista anterior</div>
    <svg class="fig" id="svg-ant" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>

<div class="info-panel" id="info-panel">
  <p class="info-placeholder">Pasá el mouse sobre el nombre de un músculo para ver su función y ejercicios.</p>
</div>

<script>
// ViewBox is 900x1200:
//   x 0..600   = image area (half of 1200x1200 source)
//   x 600..900 = right label area (300px)
//   x -300..0  = left label area  (300px) — we shift: left labels at x 0..300 with image at 300..900
// 
// Simpler: viewBox = 0 0 1000 1200
//   Left labels:  x=0..180
//   Image:        x=180..780  (600px wide)
//   Right labels: x=780..1000
// Anchor coords mapped: imgX = 180 + ax%*600, imgY = ay%*1200

const VB_W = 1000, VB_H = 1200;
const IMG_X = 180, IMG_W = 600, IMG_H = 1200;
const LABEL_RIGHT_X = IMG_X + IMG_W + 8;  // 788
const LABEL_LEFT_X  = IMG_X - 8;          // 172

const MUSCLES = [
  // ─── POSTERIOR ──────────────────────────────────────────────────────────────

  {id:'p-occip',    view:'post', side:'R', ax:52, ay:7,
   name:'Occipitofrontal',

  {id:'p-eleesc',    view:'post', side:'L', ax:52, ay:13,
   name:'Elevador de la escápula',

  {id:'p-romb',    view:'post', side:'R', ax:63, ay:22,

  {id:'p-supraes',    view:'post', side:'L', ax:43, ay:18,

  {id:'p-delt-post',    view:'post', side:'R', ax:79, ay:18,

  {id:'p-infra',    view:'post', side:'L', ax:42, ay:20,

  {id:'p-dorsal',    view:'post', side:'R', ax:68, ay:30,

  {id:'p-redmay',    view:'post', side:'L', ax:41, ay:23,

  {id:'p-tric-lat',    view:'post', side:'L', ax:32, ay:31,

  {id:'p-glutmin',    view:'post', side:'R', ax:68, ay:44,
   name:'Glúteo menor',

  {id:'p-glut',    view:'post', side:'L', ax:50, ay:49,

  {id:'p-gemsuper',    view:'post', side:'R', ax:68, ay:45,

function buildSVG(view) {
  const svgEl = document.getElementById('svg-' + view);
  const ns = 'http://www.w3.org/2000/svg';

  // Image: post uses left half (x=0..600), ant uses right half (x=600..1200)
  const srcX = view === 'post' ? 0 : 600;
  const imgEl = document.createElementNS(ns, 'image');
  imgEl.setAttribute('href', IMG_SRC);
  imgEl.setAttribute('x', IMG_X);
  imgEl.setAttribute('y', 0);
  imgEl.setAttribute('width', IMG_W);
  imgEl.setAttribute('height', IMG_H);
  // Crop using preserveAspectRatio + clipPath
  // Use a clipPath to show only the correct half
  const clipId = 'clip-' + view;
  const defs = document.createElementNS(ns, 'defs');
  const clip = document.createElementNS(ns, 'clipPath');
  clip.setAttribute('id', clipId);
  const clipRect = document.createElementNS(ns, 'rect');
  clipRect.setAttribute('x', IMG_X); clipRect.setAttribute('y', 0);
  clipRect.setAttribute('width', IMG_W); clipRect.setAttribute('height', IMG_H);
  clip.appendChild(clipRect); defs.appendChild(clip); svgEl.appendChild(defs);

  // Use a nested SVG to crop the image
  const nested = document.createElementNS(ns, 'svg');
  nested.setAttribute('x', IMG_X); nested.setAttribute('y', 0);
  nested.setAttribute('width', IMG_W); nested.setAttribute('height', IMG_H);
  nested.setAttribute('viewBox', srcX + ' 0 600 1200');
  nested.setAttribute('preserveAspectRatio', 'none');
  const imgInner = document.createElementNS(ns, 'image');
  imgInner.setAttribute('href', IMG_SRC);
  imgInner.setAttribute('x', 0); imgInner.setAttribute('y', 0);
  imgInner.setAttribute('width', 1200); imgInner.setAttribute('height', 1200);
  nested.appendChild(imgInner);
  svgEl.appendChild(nested);

  // Muscles for this view
  const muscles = MUSCLES.filter(m => m.view === view);
  const leftMs  = muscles.filter(m => m.side === 'L').sort((a,b) => a.ay - b.ay);
  const rightMs = muscles.filter(m => m.side === 'R').sort((a,b) => a.ay - b.ay);

  // Spread positions to avoid overlap (in VB units)
  function spread(list, minGap) {
    const pos = list.map(m => m.ay / 100 * IMG_H);
    for (let iter = 0; iter < 100; iter++) {
      for (let i = 1; i < pos.length; i++) {
        if (pos[i] - pos[i-1] < minGap) {
          const mid = (pos[i] + pos[i-1]) / 2;
          pos[i-1] = mid - minGap/2;
          pos[i]   = mid + minGap/2;
        }
      }
      if (pos[0] < 10) pos[0] = 10;
      if (pos[pos.length-1] > IMG_H - 10) pos[pos.length-1] = IMG_H - 10;
    }
    return pos;
  }

  const rightY = spread(rightMs, 20);

  let pinnedEl = null;

  function addLabel(m, labelY, side) {
    // Anchor in SVG coords
    const ax = IMG_X + m.ax / 100 * IMG_W;
    const ay = m.ay / 100 * IMG_H;

    // Line endpoint
    const lx = side === 'L' ? IMG_X - 4 : IMG_X + IMG_W + 4;

    // Line
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', ax); line.setAttribute('y1', ay);
    line.setAttribute('x2', lx); line.setAttribute('y2', labelY);
    line.setAttribute('stroke', '#3a4a5a'); line.setAttribute('stroke-width', '0.6');
    svgEl.appendChild(line);

    // Dot
    const dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', ax); dot.setAttribute('cy', ay);
    dot.setAttribute('r', '3'); dot.setAttribute('fill', '#4a5568');
    svgEl.appendChild(dot);

    // Label (foreignObject)
    const fo = document.createElementNS(ns, 'foreignObject');
    const lblW = 170;
    const foX  = side === 'L' ? IMG_X - lblW - 6 : IMG_X + IMG_W + 6;
    const foY  = labelY - 11;
    fo.setAttribute('x', foX); fo.setAttribute('y', foY);
    fo.setAttribute('width', lblW); fo.setAttribute('height', 22);
    fo.setAttribute('overflow', 'visible');

    const span = document.createElement('span');
    span.className = 'lbl';
    span.textContent = m.name;
    if (side === 'R') span.style.textAlign = 'left';
    else { span.style.textAlign = 'right'; span.style.display = 'block'; }

    span.addEventListener('mouseenter', () => { if (!pinnedEl) { showInfo(m); highlight(dot, line, span, true); }});
    span.addEventListener('mouseleave', () => { if (!pinnedEl) { clearInfo(); highlight(dot, line, span, false); }});
    span.addEventListener('click', () => {
      if (pinnedEl === span) {
        pinnedEl = null; span.classList.remove('active');
        highlight(dot, line, span, false); clearInfo();
      } else {
        if (pinnedEl) { pinnedEl.classList.remove('active'); }
        pinnedEl = span; span.classList.add('active');
        highlight(dot, line, span, true); showInfo(m);
      }
    });

    fo.appendChild(span);
    svgEl.appendChild(fo);
  }

  leftMs.forEach( (m,i) => addLabel(m, leftY[i],  'L'));
  rightMs.forEach((m,i) => addLabel(m, rightY[i], 'R'));
}

function highlight(dot, line, span, on) {
  dot.setAttribute('fill',   on ? '#4a9e6b' : '#4a5568');
  line.setAttribute('stroke', on ? '#4a9e6b' : '#3a4a5a');
}

buildSVG('post');
buildSVG('ant');

const panel = document.getElementById('info-panel');
function showInfo(m) {
  const chips = m.ex.split('|').map(e => `<span class="ex-chip">${e}</span>`).join('');
  panel.innerHTML = `
    <div class="info-name"><small>Músculo</small>${m.name}</div>
    <div class="info-body">
      <div class="info-func"><p class="sec-label">Función</p><p>${m.func}</p></div>
      <div class="ex-grid"><p class="sec-label">Ejercicios</p><div class="ex-chips">${chips}</div></div>
    </div>`;
}
function clearInfo() {
  panel.innerHTML = '<p class="info-placeholder">Pasá el mouse sobre el nombre de un músculo para ver su función y ejercicios.</p>';
}
</script>
